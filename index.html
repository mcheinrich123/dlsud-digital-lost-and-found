<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Find It - Welcome & Upload</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .drop-zone { border: 2px dashed #3498db; border-radius: 8px; padding: 40px 20px; cursor: pointer; background: #fbfcfc; transition: background 0.3s; }
        .drop-zone--over { border-color: #2ecc71; background: #e8f8f5; }
        .drop-zone__input { display: none; }
        .preview-img { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 6px; display: none; }
        textarea { width: 100%; height: 100px; margin: 20px 0; padding: 12px; border: 1px solid #dcdde1; border-radius: 6px; resize: vertical; box-sizing: border-box; font-family: inherit; }
        button { background: #3498db; color: white; border: none; padding: 12px 30px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #2980b9; }
        .nav-link { margin-top: 20px; display: inline-block; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to Let's Find It 🔍</h1>
    <p>Report a found item to help it find its way home.</p>
    
    <form id="uploadForm">
        <div class="drop-zone" id="dropZone">
            <span class="drop-zone__prompt">Drag & Drop item photo here or click to upload</span>
            <input type="file" name="image" id="fileInput" class="drop-zone__input" accept="image/*" required>
            <img id="preview" class="preview-img" alt="Preview">
        </div>

        <textarea id="description" placeholder="Describe the item securely (e.g., brand, color, specific markings, location found)..." required></textarea>
        <button type="submit">Submit to System</button>
    </form>
    
    <a href="gallery.html" class="nav-link">View Found Items Gallery →</a>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const prompt = document.querySelector('.drop-zone__prompt');
    const form = document.getElementById('uploadForm');

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) updatePreview(fileInput.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drop-zone--over');
    });

    ['dragleave', 'dragend'].forEach(type => {
        dropZone.addEventListener(type, () => dropZone.classList.remove('drop-zone--over'));
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drop-zone--over');
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            updatePreview(e.dataTransfer.files[0]);
        }
    });

    function updatePreview(file) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
            preview.src = reader.result;
            preview.style.display = 'block';
            prompt.style.display = 'none';
        };
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
       const formData = new FormData();
       formData.append('image', fileInput.files[0]); 
       formData.append('description', document.getElementById('description').value);

        try {
            const response = await fetch('http://127.0.0.1:5000/api/items', {

                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (response.ok) {
                alert('Success! Item logged permanently.');
                form.reset();
                preview.style.display = 'none';
                prompt.style.display = 'block';
            } else {
                alert('Error: ' + data.error);
            }
        } catch (err) {
            alert('Could not connect to back-end server.');
        }
    });
</script>
</body>
</html>
