<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Find It - Gallery</title>
    <!-- Load Socket.io Client to send immediate real-time signals straight to SWAFO -->
    <script src="https://socket.io"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 40px; }
        h1 { text-align: center; color: #2c3e50; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; max-width: 1200px; margin: 40px auto; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 15px; }
        .card-text { color: #555; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        
        /* 🔍 ENLARGED MODAL VIEW LAYOUT WITH CLAIM BUTTON */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 800px; width: 90%; display: flex; gap: 25px; position: relative; }
        .modal-left img { max-width: 450px; max-height: 450px; object-fit: contain; border-radius: 6px; }
        .modal-right { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .modal-description { font-size: 16px; color: #333; line-height: 1.6; }
        .claim-btn { background: #e74c3c; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .claim-btn:hover { background: #c0392b; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

<h1>Found Items Gallery 📦</h1>
<div class="gallery-grid" id="galleryGrid"></div>
<a href="index.html" class="back-link">← Go Back to Report Form</a>

<!-- Pop-up Enlarged Modal -->
<div class="modal" id="itemModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <div class="modal-left">
            <img id="modalImage" src="" alt="Enlarged Item">
        </div>
        <div class="modal-right">
            <div>
                <h3>Item Description</h3>
                <p class="modal-description" id="modalDescription"></p>
            </div>
            <button class="claim-btn" id="claimButton">Claim This Item</button>
        </div>
    </div>
</div>

<script>
    const BACKEND_URL = 'http://127.0.0.1:5000';
    const socket = io(BACKEND_URL);
    let selectedItemId = null;
    let selectedItemDesc = "";

    // Fetch images from SQLite backend and render card layouts dynamically
    async function loadGallery() {
        try {
            const res = await fetch(`${BACKEND_URL}/api/items`);
            const items = await res.json();
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = items.length === 0 ? '<p style="grid-column: 1/-1; text-align:center; color:#888;">No found items listed right now.</p>' : '';
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${BACKEND_URL}/${item.image_path}" alt="Found item">
                    <div class="card-body">
                        <p class="card-text">${item.description}</p>
                    </div>
                `;
                card.onclick = () => openModal(item);
                grid.appendChild(card);
            });
        } catch (err) {
            console.error("Failed fetching item data feed:", err);
        }
    }

    // Modal behavior functions
    function openModal(item) {
        selectedItemId = item.id;
        selectedItemDesc = item.description;
        document.getElementById('modalImage').src = `${BACKEND_URL}/${item.image_path}`;
        document.getElementById('modalDescription').innerText = item.description;
        document.getElementById('itemModal').style.display = 'flex';
    }

    document.getElementById('closeModal').onclick = () => {
        document.getElementById('itemModal').style.display = 'none';
    };

    // ⚡ REAL-TIME DISPATCH TO SWAFO HANDLER
    document.getElementById('claimButton').onclick = () => {
        if (!selectedItemId) return;
        
        // Emits an instant message socket payload 
        socket.emit('claim_item', {
            item_id: selectedItemId,
            description: selectedItemDesc
        });
        
        alert('Claim request sent! SWAFO has been notified immediately via real-time stream.');
        document.getElementById('itemModal').style.display = 'none';
    };

    window.onload = loadGallery;
</script>
</body>
</html>
